# 示例配置：复制为 configs/config.yaml 后按需修改。
# 生产环境优先使用 SAAS_ 前缀环境变量覆盖，例如：
#   SAAS_DATABASE__PLATFORM_DSN / SAAS_DATABASE__TENANT_DSN / SAAS_REDIS__ADDR
#   SAAS_AUTH__SECRET
# 不要把真实的 config.yaml、密钥或云厂商凭据提交到仓库。

app:
  name: go-saas-lite
  env: dev

server:
  addr: ":8080"
  read_header_timeout_sec: 5
  read_timeout_sec: 10
  write_timeout_sec: 30
  idle_timeout_sec: 60
  shutdown_timeout_sec: 15
  allowed_origins: []
  max_body_mb: 2

log:
  level: info
  format: text

trace:
  enabled: true
  exporter: none   # none | stdout

metrics:
  enabled: true

auth:
  issuer_name: "go-saas-lite"
  # dev 环境留空会使用内置开发密钥；生产必须通过 SAAS_AUTH__SECRET 注入。
  secret: ""
  access_ttl_seconds: 900

database:
  # 平台组与租户组可指向同一个库；分库时分别配置。
  platform_dsn: "postgres://postgres:postgres@127.0.0.1:5432/saas?sslmode=disable"
  tenant_dsn: "postgres://postgres:postgres@127.0.0.1:5432/saas?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5

redis:
  addr: "127.0.0.1:6379"   # 为空时不启用缓存、队列与失效广播
  password: ""
  db: 0

worker:
  interval_seconds: 60
  cooling_days: 7
  # app.env=dev 时 api 进程会自动附带启动 worker；生产建议单独运行 cmd/worker。

audit:
  retention_days: 90

# MCP 上游凭据的 AES-GCM 加密密钥。
# 留空时按明文存储，仅适合本地开发；生产务必通过 SAAS_MCP__CREDENTIAL_KEY 配置。
mcp:
  credential_key: ""

# 租户域名解析；全局登录不依赖子域名，OAuth 与自定义域名场景使用。
tenancy:
  base_domain: "localhost"

# 对象存储：local | cos | oss。
# 云驱动凭据不要写入仓库，使用环境变量注入。
storage:
  driver: local
  max_upload_mb: 20
  local:
    root: "./data/files"
    base_url: "http://localhost:8080/api/files/download"
    signing_key: ""
  cos:
    bucket: ""
    region: ""
    secret_id: ""
    secret_key: ""
    endpoint: ""
  oss:
    bucket: ""
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""

# 短信通道：当前仅支持 dev（验证码写入日志）。
sms:
  provider: dev

# 营销门户与自助注册。
portal:
  enabled: true
  console_url: "http://localhost:5173"
  auto_approve: true
  signup_rate_per_hour: 5

# asynq 异步任务；未配置 Redis 或 enabled=false 时自动降级。
queue:
  enabled: true
  concurrency: 10
  heartbeat: false

# OpenAPI 文档与 Swagger UI。
docs:
  enabled: true
