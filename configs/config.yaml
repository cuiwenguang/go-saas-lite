# 进程级配置：yaml + 环境变量（SAAS_ 前缀，__ 表示层级），重启生效。
app:
  name: go-saas-lite
  env: dev

server:
  addr: ":8080"
  read_header_timeout_sec: 5
  read_timeout_sec: 10
  write_timeout_sec: 30
  idle_timeout_sec: 60
  shutdown_timeout_sec: 15
  allowed_origins: []
  max_body_mb: 2

log:
  level: info
  format: text

trace:
  enabled: true
  exporter: none   # none | stdout

metrics:
  enabled: true

# 数据库与 Redis 连接：dev 默认值写在这里，本地可直接启动；
# 生产用环境变量覆盖：SAAS_DATABASE__PLATFORM_DSN / SAAS_DATABASE__TENANT_DSN / SAAS_REDIS__ADDR
database:
  platform_dsn: "postgres://postgres:123456@127.0.0.1:5432/saas_test?sslmode=disable"
  tenant_dsn: "postgres://postgres:123456@127.0.0.1:5432/saas_test?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5

redis:
  addr: "127.0.0.1:6379"   # 为空时不启用缓存与失效广播
  password: ""
  db: 0

worker:
  interval_seconds: 60
  cooling_days: 7   # 归档租户数据清理的冷却期
  # app.env=dev 时 api 进程会自动附带启动 worker，无需单独起 cmd/worker。

audit:
  retention_days: 90   # 审计日志保留天数（worker 每日清理更早的记录）

# MCP 网关：credential_key 用于上游凭据的 AES-GCM 静态加密。
# 留空时按明文存储，仅适合本地开发；生产务必通过 SAAS_MCP__CREDENTIAL_KEY 配置。
mcp:
  credential_key: ""

# 租户域名解析：登录等免鉴权接口靠 base_domain 从 Host 取子域名（如 acme.example.com → acme）。
# 生产用 SAAS_TENANCY__BASE_DOMAIN 覆盖；本地调试访问 demo.localhost 即可命中。
tenancy:
  base_domain: "localhost"

# 对象存储：local | cos | oss。
# cos 需 bucket/region/secret_id/secret_key；oss 需 bucket/endpoint/access_key_id/access_key_secret。
# 凭据生产环境请用 SAAS_STORAGE__COS__SECRET_ID 等环境变量覆盖，不要入库。
# signing_key 仅本地驱动使用，生产务必通过 SAAS_STORAGE__LOCAL__SIGNING_KEY 配置。
storage:
  driver: local
  max_upload_mb: 20
  local:
    root: "./data/files"
    base_url: "http://localhost:8080/api/files/download"
    signing_key: ""
  cos:
    bucket: ""
    region: ""
    secret_id: ""
    secret_key: ""
    endpoint: ""
  oss:
    bucket: ""
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""

# 短信通道：dev 只把验证码写日志；后续接入阿里云/腾讯云时改 provider。
sms:
  provider: dev

# 营销门户与自助注册。
portal:
  enabled: true
  console_url: "http://localhost:5173"
  auto_approve: true
  signup_rate_per_hour: 5

# asynq 异步任务；未配置 Redis 或 enabled=false 时自动降级。
queue:
  enabled: true
  concurrency: 10
  heartbeat: false

# OpenAPI 文档与 Swagger UI。
docs:
  enabled: true

