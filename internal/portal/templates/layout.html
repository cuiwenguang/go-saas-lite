{{define "layout"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · go-saas-lite</title>
  <link rel="stylesheet" href="/portal.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="/" class="text-lg font-semibold tracking-tight">go-saas-lite</a>
      <nav class="flex items-center gap-4 text-sm text-slate-600 sm:gap-6">
        <a href="/pricing" class="hover:text-slate-900">价格</a>
        <a href="/login" class="hover:text-slate-900">登录</a>
        <a href="/signup" class="rounded-lg bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">免费注册</a>
      </nav>
    </div>
  </header>

  <main>{{template "content" .}}</main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-2 px-6 py-8 text-sm text-slate-500 sm:flex-row sm:items-center sm:justify-between">
      <p>© {{.Year}} go-saas-lite</p>
      <div class="flex gap-4">
        <a href="/terms" class="hover:text-slate-900">服务条款</a>
        <a href="/privacy" class="hover:text-slate-900">隐私政策</a>
      </div>
    </div>
  </footer>
</body>
</html>
{{end}}
