components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        code: {type: integer, example: 0}
        msg: {type: string, example: ok}
        data: {}
        request_id: {type: string}
    ErrorEnvelope:
      type: object
      properties:
        code: {type: integer, example: 1000}
        msg: {type: string}
        data: {}
        request_id: {type: string}
    LoginInput:
      type: object
      properties:
        email: {type: string}
        phone: {type: string}
        password: {type: string}
        code: {type: string}
    TokenOutput:
      type: object
      properties:
        access_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 3600}
        refresh_token: {type: string}
        scope: {type: string, example: mcp}
    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token: {type: string}
                token_type: {type: string}
                expires_in: {type: integer}
                must_change_password: {type: boolean}
    PlatformLoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token: {type: string}
                token_type: {type: string}
                expires_in: {type: integer}
                role: {type: string}
    PageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: {}
                total: {type: integer}
                page: {type: integer}
                size: {type: integer}
    QuotaLimits:
      type: object
      properties:
        max_users: {type: integer}
        storage_gb: {type: integer}
        api_qps: {type: integer}
        api_calls: {type: integer}
        mcp_calls: {type: integer}
        mcp_tokens: {type: integer}
        mcp_sessions: {type: integer}
        features:
          type: array
          items: {type: string}
    FileOutput:
      type: object
      properties:
        id: {type: string}
        key: {type: string}
        biz: {type: string}
        original_name: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer}
        created_at: {type: string, format: date-time}
    AuditLog:
      type: object
      properties:
        id: {type: string}
        category: {type: string}
        action: {type: string}
        level: {type: string, enum: [info, warn]}
        result: {type: string, enum: [success, failed]}
        actor_id: {type: string}
        actor_email: {type: string}
        object_type: {type: string}
        object_id: {type: string}
        summary: {type: string}
        before: {type: object, nullable: true}
        after: {type: object, nullable: true}
        request_id: {type: string}
        ip: {type: string}
        created_at: {type: string, format: date-time}
